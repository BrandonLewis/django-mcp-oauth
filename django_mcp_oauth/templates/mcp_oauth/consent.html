<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authorize access</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; color: #1a1a1a; }
    code { background: #f2f2f2; padding: .1em .3em; border-radius: .2em; }
    button { font: inherit; padding: .5em 1.2em; margin-right: .5em; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Authorize access</h1>
  <p><strong>{{ client.client_name|default:client.client_id }}</strong> is requesting
     access to your data (scope: <code>{{ scope }}</code>).</p>
  <form method="post">
    {% csrf_token %}
    <button name="confirm" value="yes">Allow</button>
    <button name="confirm" value="no">Deny</button>
  </form>
  <p><small>Override this page by setting <code>MCP_OAUTH_CONSENT_TEMPLATE</code> to
     your own template; it receives <code>grant</code>, <code>client</code> and
     <code>scope</code>.</small></p>
</body>
</html>
